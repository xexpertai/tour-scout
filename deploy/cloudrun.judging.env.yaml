# Judging window (2–16 Nov): higher caps so judges never meet a limit, applied on top of
# cloudrun.env.yaml by `scripts/deploy-cloudrun.sh judging-on` (with min instances 1, no cold starts)
# and reverted by `judging-off`. Worst case per day: 120 live tours ≈ 3,500 Qloo requests (≈29 each).
#
# Claude math (measured 7 Oct, Haiku 4.5): a tour's text ≈ $0.014; each agent route-check / scout call
# ≈ $0.002–0.008 (≈ $0.012 for a 3-call check). A live tour with its automatic route check ≈ 4 calls ≈
# $0.026, i.e. ≈ $0.0065 a call. The $4 judging ceiling over 14 days is ≈ $0.29/day ≈ 44 calls/day, so
# the daily cap is 45: 150/day (≈ $1/day) would use up $4 in about 4 days. Past either cap, text is
# templated (labelled) and the templated route check still works. For 150/day, raise LLM_SPEND_CAP_USD
# to about 14 (the shared Claude credit is about $8 in all, so that needs a new credit source).
TOUR_RUNS_PER_HOUR: "20"       # per IP: judges may share one office address (NAT)
FOLLOWUPS_PER_HOUR: "60"
RESOLVES_PER_HOUR: "150"
TOUR_DAILY_CAP: "120"          # live tours per UTC day for the service (saved under /data)
LLM_DAILY_CAP: "45"            # model calls per UTC day (saved under /data); see the math above
LLM_BUDGET_PERIOD: "judging"   # a new period: the $4 ceiling starts at $0
LLM_SPEND_CAP_USD: "4"
