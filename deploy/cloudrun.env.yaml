# Non-secret environment for the Cloud Run service (scripts/deploy-cloudrun.sh passes it with
# --env-vars-file). Secrets (QLOO_API_KEY, CLAUDE_API_KEY) come from Secret Manager, never from here.
QLOO_BASE_URL: "https://hackathon.api.qloo.com"
QLOO_TRUSTED_BASE_URL: "https://hackathon.api.qloo.com"
LLM_PROVIDER: "claude"
# A Cloud Storage bucket mounted here keeps share links, the daily LLM counter and the place-name cache.
DATA_DIR: "/data"
# Public-demo caps. Demo posters replay captured runs and cost nothing; these bound live use.
TOUR_RUNS_PER_HOUR: "3"        # live tours per visitor per hour
FOLLOWUPS_PER_HOUR: "10"       # scout questions and applies per visitor per hour
RESOLVES_PER_HOUR: "30"
TOUR_DAILY_CAP: "40"           # live tours per UTC day for the whole service (~29 Qloo requests each)
LLM_DAILY_CAP: "60"            # Claude Haiku calls per UTC day (~$0.01 each): at most ~$0.60/day
QLOO_CONCURRENCY: "3"
NOMINATIM_USER_AGENT: "tour-scout/1.0 (Qloo hackathon demo)"
